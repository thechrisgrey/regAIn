name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Target environment for deployment"
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            infra/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt -r infra/requirements.txt

      - name: Create Lambda layer stubs
        run: mkdir -p infra/layer_build/python _layer/python

      - name: Run tests with coverage
        run: pytest tests/ -x -q --cov=backend --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import xml.etree.ElementTree as ET, sys, os
          if not os.path.exists('coverage.xml'):
              print('No coverage.xml found'); sys.exit(0)
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Overall line coverage: {rate:.1f}%')
          " >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run SAST scan
        run: bandit -r backend/ -ll -ii -q --skip B608

      - name: Audit dependencies
        run: pip-audit -r tests/requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npx vitest --run --coverage

      - name: Coverage summary
        if: always()
        run: |
          echo "## Frontend Coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const r = require('./coverage/coverage-summary.json').total;
              const fmt = (o) => o.pct + '%';
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Lines | ' + fmt(r.lines) + ' |');
              console.log('| Branches | ' + fmt(r.branches) + ' |');
              console.log('| Functions | ' + fmt(r.functions) + ' |');
              console.log('| Statements | ' + fmt(r.statements) + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report found" >> "$GITHUB_STEP_SUMMARY"
          fi

  infra:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDK dependencies
        run: pip install -r infra/requirements.txt

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Create Lambda layer stubs
        run: mkdir -p infra/layer_build/python _layer/python

      - name: Synthesize all stacks
        working-directory: infra
        run: cdk synth --quiet --app "python app.py"

      - name: Validate synthesis produced all 9 stacks
        working-directory: infra
        run: |
          STACK_COUNT=$(ls -1 cdk.out/*.template.json 2>/dev/null | wc -l)
          echo "Synthesized $STACK_COUNT stacks"
          if [ "$STACK_COUNT" -ne 9 ]; then
            echo "ERROR: Expected 9 stacks, got $STACK_COUNT"
            exit 1
          fi

  build-layer:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Build Strands Lambda layer
        run: |
          mkdir -p infra/layer_build/python
          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD/infra/layer_build/python:/out" \
            python:3.12-slim \
            bash -c "pip install strands-agents strands-agents-tools aws-sdk-bedrock-runtime 'PyJWT[crypto]' --target /out --no-cache-dir && find /out -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; true"

      - name: Build MarketIntel deps layer
        run: |
          mkdir -p _layer/python
          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD/_layer/python:/out" \
            python:3.12-slim \
            bash -c "pip install requests --target /out --no-cache-dir && find /out -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; true"

      - name: Report layer sizes
        run: |
          du -sh infra/layer_build/python
          du -sh _layer/python

      - name: Upload layer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layers
          path: |
            infra/layer_build/
            _layer/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, infra, build-layer]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: ${{ github.event.inputs.deploy_environment || 'staging' }}
    timeout-minutes: 30
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Download layer artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-layers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDK dependencies
        run: pip install -r infra/requirements.txt

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      # ------------------------------------------------------------------
      # AWS credentials via OIDC federation.
      # PREREQUISITE: You must configure the following before this works:
      #
      # 1. Create an OIDC Identity Provider in your AWS account:
      #    - Provider URL: https://token.actions.githubusercontent.com
      #    - Audience: sts.amazonaws.com
      #
      # 2. Create an IAM role "RegainGitHubDeploy" with:
      #    - Trust policy allowing:
      #      Principal: { Federated: <OIDC provider ARN> }
      #      Condition:
      #        StringEquals:
      #          token.actions.githubusercontent.com:aud: sts.amazonaws.com
      #        StringLike:
      #          token.actions.githubusercontent.com:sub: repo:thechrisgrey/regAIn:*
      #    - Permissions: CloudFormation, Lambda, DynamoDB, API Gateway,
      #      Cognito, S3, Bedrock, IAM (scoped to Regain* resources),
      #      plus sts:AssumeRole for the CDK bootstrap roles
      #
      # 3. Add GitHub repository secret:
      #    AWS_DEPLOY_ROLE_ARN = arn:aws:iam::<account>:role/RegainGitHubDeploy
      # ------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK diff (preview changes)
        working-directory: infra
        run: npx cdk diff --all --app "python app.py" 2>&1 || true

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --all --require-approval never --app "python app.py"
