name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            infra/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt -r infra/requirements.txt

      - name: Create Lambda layer stub
        run: mkdir -p infra/layer_build/python

      - name: Run tests
        run: pytest tests/ -x -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest --run

  infra:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDK dependencies
        run: pip install -r infra/requirements.txt

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Create Lambda layer stub
        run: mkdir -p infra/layer_build/python

      - name: Synthesize all stacks
        working-directory: infra
        run: cdk synth --quiet 2>&1 | tail -20

      - name: Validate synthesis produced all 8 stacks
        working-directory: infra
        run: |
          STACK_COUNT=$(ls -1 cdk.out/*.template.json 2>/dev/null | wc -l)
          echo "Synthesized $STACK_COUNT stacks"
          if [ "$STACK_COUNT" -lt 8 ]; then
            echo "ERROR: Expected 8 stacks, got $STACK_COUNT"
            exit 1
          fi
